name: DEBUG promotionitems format

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Scrape one small promo file and inspect promotionitems
        run: |
          python3 - <<'EOF'
          import csv, sys
          csv.field_size_limit(sys.maxsize)
          from il_supermarket_scarper import ScarpingTask, FileTypesFilters
          from il_supermarket_parsers import ConvertingTask
          import pandas as pd
          import os

          task = ScarpingTask(
              enabled_scrapers=["RAMI_LEVY"],
              files_types=[FileTypesFilters.PROMO_FULL_FILE.name],
              multiprocessing=1,
              timeout_in_seconds=300,
          )
          t = task.start(limit=1)
          t.join()

          print("dumps/RamiLevy:", os.listdir("dumps/RamiLevy"))

          task2 = ConvertingTask(
              source_configuration={"folder": "dumps"},
              output_configuration=[{"output_mode": "csv", "output_folder": "parsed"}],
              status_configuration={"database_type": "json", "base_path": "parsed"},
              enabled_parsers=["RAMI_LEVY"],
          )
          t2 = task2.start()
          t2.join()

          for root, dirs, files in os.walk("parsed"):
              for f in files:
                  print(os.path.join(root, f))

          for root, dirs, files in os.walk("parsed"):
              for f in files:
                  if "promo" in f.lower() and f.lower().endswith(".csv"):
                      df = pd.read_csv(os.path.join(root, f), dtype=str)
                      print("COLUMNS:", list(df.columns))
                      print("rows:", len(df))
                      if "promotionitems" in df.columns:
                          sample = df[df["promotionitems"].notna()]
                          print("non-null promotionitems count:", len(sample))
                          for v in sample["promotionitems"].head(10):
                              print("VALUE:", repr(v))
                      pd.set_option("display.max_colwidth", 300)
                      print(df.head(5).to_string())
          EOF
