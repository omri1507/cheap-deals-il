name: Weekly deals digest

on:
  schedule:
    # 04:00 UTC Sunday = 06:00/07:00 Israel time depending on DST.
    # GitHub cron can run a few minutes late; that's fine for a weekly job.
    - cron: "0 4 * * 0"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  build-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly scrape + filter
        run: python3 weekly_deals.py

      - name: Commit updated data
        run: |
          git config user.name "weekly-deals-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update weekly deals digest"
          git push
