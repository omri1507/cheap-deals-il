name: DEBUG store parsing

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Scrape + parse RAMI_LEVY store list only
        run: |
          python3 - <<'EOF'
          import csv, sys
          csv.field_size_limit(sys.maxsize)
          from il_supermarket_scarper import ScarpingTask, FileTypesFilters
          from il_supermarket_parsers import ConvertingTask
          import pandas as pd
          import os

          task = ScarpingTask(
              enabled_scrapers=["RAMI_LEVY"],
              files_types=[FileTypesFilters.STORE_FILE.name],
              multiprocessing=2,
              timeout_in_seconds=300,
          )
          t = task.start()
          t.join()

          print("dumps/RamiLevy contents:", os.listdir("dumps/RamiLevy"))

          task2 = ConvertingTask(
              source_configuration={"folder": "dumps"},
              output_configuration=[{"output_mode": "csv", "output_folder": "parsed"}],
              status_configuration={"database_type": "json", "base_path": "parsed"},
              enabled_parsers=["RAMI_LEVY"],
          )
          t2 = task2.start()
          t2.join()

          print("=== parsed/ tree ===")
          for root, dirs, files in os.walk("parsed"):
              for f in files:
                  print(os.path.join(root, f))

          for root, dirs, files in os.walk("parsed"):
              for f in files:
                  if f.lower().endswith(".csv") and "store" in f.lower():
                      path = os.path.join(root, f)
                      df = pd.read_csv(path, dtype=str)
                      print(f"\n=== {path}: {len(df)} rows ===")
                      print(df.head(20).to_string())
                      print("dup storeid counts:")
                      if "storeid" in df.columns:
                          print(df["storeid"].value_counts().head(10))
          EOF
