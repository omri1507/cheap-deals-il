name: DEBUG store 274 promos

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Scrape + parse Shufersal only, check store 274
        run: |
          python3 - <<'EOF'
          import csv, sys
          csv.field_size_limit(sys.maxsize)
          from il_supermarket_scarper import ScarpingTask, FileTypesFilters
          from il_supermarket_parsers import ConvertingTask
          import pandas as pd
          import os

          task = ScarpingTask(
              enabled_scrapers=["SHUFERSAL"],
              files_types=[FileTypesFilters.PRICE_FULL_FILE.name, FileTypesFilters.PROMO_FULL_FILE.name],
              multiprocessing=3,
              timeout_in_seconds=1200,
          )
          t = task.start()
          t.join()

          task2 = ConvertingTask(
              source_configuration={"folder": "dumps"},
              output_configuration=[{"output_mode": "csv", "output_folder": "parsed"}],
              status_configuration={"database_type": "json", "base_path": "parsed"},
              enabled_parsers=["SHUFERSAL"],
          )
          t2 = task2.start()
          t2.join()

          for root, dirs, files in os.walk("parsed"):
              for f in files:
                  print(os.path.join(root, f))

          promo_df = None
          for root, dirs, files in os.walk("parsed"):
              for f in files:
                  if "promofull" in f.lower():
                      df = pd.read_csv(os.path.join(root, f), dtype=str).ffill()
                      promo_df = df if promo_df is None else pd.concat([promo_df, df], ignore_index=True)

          print("total promo rows:", len(promo_df))
          store_col = [c for c in promo_df.columns if "storeid" in c][0]
          print("store_col:", store_col)
          print("unique storeids sample:", promo_df[store_col].unique()[:20])
          mine = promo_df[promo_df[store_col].astype(str) == "274"]
          print("rows for store 274:", len(mine))
          desc_col = [c for c in promo_df.columns if "promotiondescription" in c]
          if desc_col and not mine.empty:
              print(mine[desc_col[0]].head(20).to_string())
          EOF
