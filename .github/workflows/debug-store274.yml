name: DEBUG store 274 promos

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Scrape + parse Shufersal only, check store 274
        run: |
          python3 - <<'EOF'
          import csv, sys
          csv.field_size_limit(sys.maxsize)
          from il_supermarket_scarper import ScarpingTask, FileTypesFilters
          from il_supermarket_parsers import ConvertingTask
          import pandas as pd
          import os

          task = ScarpingTask(
              enabled_scrapers=["SHUFERSAL"],
              files_types=[FileTypesFilters.PROMO_FULL_FILE.name, FileTypesFilters.PRICE_FULL_FILE.name],
              multiprocessing=3,
              timeout_in_seconds=1200,
          )
          t = task.start()
          t.join()

          task2 = ConvertingTask(
              source_configuration={"folder": "dumps"},
              output_configuration=[{"output_mode": "csv", "output_folder": "parsed"}],
              status_configuration={"database_type": "json", "base_path": "parsed"},
              enabled_parsers=["SHUFERSAL"],
          )
          t2 = task2.start()
          t2.join()

          for root, dirs, files in os.walk("parsed"):
              for f in files:
                  print(os.path.join(root, f))

          def load(hint):
              frames = []
              for root, dirs, files in os.walk("parsed"):
                  for f in files:
                      if hint in f.lower() and f.lower().endswith(".csv"):
                          frames.append(pd.read_csv(os.path.join(root, f), dtype=str).ffill())
              return pd.concat(frames, ignore_index=True) if frames else pd.DataFrame()

          promo_df = load("promo")
          prices_df = load("price")
          print("promo rows:", len(promo_df), "| price rows:", len(prices_df))
          print("PROMO COLUMNS:", list(promo_df.columns))
          print("PRICE COLUMNS:", list(prices_df.columns))
          print(prices_df.head(3).to_string())

          store_col = [c for c in promo_df.columns if "storeid" in c][0]
          itemcode_promo = [c for c in promo_df.columns if "itemcode" in c][0]
          itemcode_price = [c for c in prices_df.columns if "itemcode" in c][0]
          itemname_col = [c for c in prices_df.columns if "itemname" in c][0]
          desc_col = [c for c in promo_df.columns if "promotiondescription" in c][0]

          mine = promo_df[promo_df[store_col].astype(str) == "274"]
          print("promo rows for store 274:", len(mine))

          item_names = prices_df[[itemcode_price, itemname_col]].drop_duplicates(subset=[itemcode_price])
          merged = mine.merge(item_names, left_on=itemcode_promo, right_on=itemcode_price, how="left")
          print("merged rows:", len(merged))
          print("rows where itemname is null after join:", merged[itemname_col].isna().sum())

          print("\n=== sample: promo desc | itemcode | joined itemname ===")
          print(merged[[desc_col, itemcode_promo, itemname_col]].head(30).to_string())

          NON_VEGAN_KEYWORDS = [
              "בשר", "עוף", "הודו", "כבש", "טלה", "בקר", "חזיר",
              "דג ", "דגים", "סלמון", "טונה", "פילה", "טילפיה",
              "נקניק", "המבורגר", "קבב", "שניצל", "פסטרמה", "סלמי", "נתחי",
              "חלב", "גבינה", "גבינת", "יוגורט", "לבן", "קוטג", "שמנת",
              "חמאה", "ביצים", "ביצת", "מיונז", "דבש",
          ]
          def is_food_and_vegan(name):
              if not isinstance(name, str) or not name.strip():
                  return False
              return not any(bad in name for bad in NON_VEGAN_KEYWORDS)

          names = merged[itemname_col]
          non_null = names.dropna()
          print("\nnon-null joined item names:", len(non_null))
          passing = non_null[non_null.apply(is_food_and_vegan)]
          print("passing vegan/food filter:", len(passing))
          print(passing.head(20).to_string())
          EOF
